name: CI

on:
  push:
  pull_request:

# CI 只读取公开仓源码，避免默认令牌获得无关写权限。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        # 固定完整 commit，避免可移动 tag 改变受信任的 CI 执行代码。
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.5
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        # lockfile 是公开构建边界，CI 不允许安装过程静默改写解析结果。
        run: pnpm install --frozen-lockfile
      - name: Run repository checks
        # Fresh checkout 没有 workspace dist；聚合入口会先为 type-aware lint 构建 core types。
        run: pnpm check
